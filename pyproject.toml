[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI + PostgreSQL)"
authors = [
    { name = "Carlosoliveiraym", email = "carlosalvesoliveira@ymail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.2.0",          # versão exata, validada no spike F-00 (docs/FDD.md)
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "python-dotenv",
]

[project.scripts]
api = "scripts.api:main"
restaurar = "scripts.restaurar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "pyright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um único event loop para todos os testes: o engine async é compartilhado na sessão.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["e2e: fluxo completo com Gemini real"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]          # pseudocódigo do PRD/FDD não é código executável

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]   # S = bandit (SQL/segredos)
ignore = ["S101"]                                           # assert nos testes

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["app", "scripts", "tests"]
